<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dijital Pazarım - Kod, Kupon & Dijital Lisans</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080511;
      --bg-card: rgba(18, 12, 33, 0.75);
      --bg-card-hover: rgba(28, 18, 52, 0.85);
      --purple-primary: #a855f7;
      --purple-light: #c084fc;
      --purple-dark: #7e22ce;
      --purple-glow: rgba(168, 85, 247, 0.35);
      --pink-accent: #ec4899;
      --border-subtle: rgba(168, 85, 247, 0.22);
      --border-glow: rgba(192, 132, 252, 0.6);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --price-gold: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 0% 50%, rgba(126, 34, 206, 0.12) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-bottom: 70px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 16px 16px 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--purple-light);
      box-shadow: 0 0 16px var(--purple-glow);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff 40%, var(--purple-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--purple-light);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #4ade80;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Search Bar */
    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      backdrop-filter: blur(12px);
    }

    .search-input:focus {
      border-color: var(--purple-light);
      box-shadow: 0 0 18px var(--purple-glow);
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--purple-light);
      stroke-width: 2;
    }

    /* Category Filter Tabs */
    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 2px 6px;
    }

    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, var(--purple-dark), var(--purple-primary));
      border-color: var(--purple-light);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--purple-glow);
    }

    /* Banner / Guarantee */
    .trust-banner {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(236, 72, 153, 0.1));
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .trust-text {
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.4;
    }

    .trust-text strong {
      color: var(--purple-light);
    }

    .support-pill {
      flex-shrink: 0;
      padding: 6px 12px;
      background: var(--purple-primary);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 2px 10px var(--purple-glow);
    }

    /* Product Grid */
    .products-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      backdrop-filter: blur(14px);
    }

    .product-card:active {
      transform: scale(0.985);
      border-color: var(--border-glow);
    }

    .product-thumb-wrap {
      width: 105px;
      min-width: 105px;
      position: relative;
      background: #0f0a1c;
      overflow: hidden;
    }

    .product-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-badge-corner {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid var(--purple-light);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
    }

    .product-details {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .product-cat-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--purple-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .product-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
    }

    .product-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .product-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--price-gold);
      letter-spacing: -0.5px;
    }

    .buy-btn {
      padding: 8px 14px;
      background: linear-gradient(135deg, var(--purple-primary), var(--purple-dark));
      border: 1px solid var(--purple-light);
      border-radius: 12px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 12px var(--purple-glow);
      transition: all 0.2s ease;
    }

    .buy-btn:active {
      transform: scale(0.95);
      background: linear-gradient(135deg, var(--purple-dark), var(--purple-primary));
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 13px;
      display: none;
    }

    /* Floating Reference / Trust Footer */
    .trust-footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      padding: 16px 0;
      line-height: 1.6;
    }

    .trust-footer span {
      color: var(--purple-light);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Brand Header -->
    <header class="brand-header">
      <div class="brand-info">
        <img class="brand-avatar" src="assets/logo.jpg" alt="Dijital Pazarım Logo" onerror="this.src='../static/dijitalpazarim_logo.jpg'">
        <div>
          <div class="brand-title">Dijital Pazarım</div>
          <div class="brand-sub">Kod • Kupon • Üyelik</div>
        </div>
      </div>
      <div class="live-status">
        <div class="status-dot"></div>
        <span>Aktif Stok</span>
      </div>
    </header>

    <!-- Search Input -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Ürün, kupon veya hesap ara...">
    </div>

    <!-- Category Filter Tabs -->
    <div class="filter-scroll">
      <button class="filter-btn active" data-cat="all">Tüm Ürünler</button>
      <button class="filter-btn" data-cat="market">Kupon & Market</button>
      <button class="filter-btn" data-cat="streaming">Dizi & Film</button>
      <button class="filter-btn" data-cat="ai">Yapay Zeka</button>
      <button class="filter-btn" data-cat="music">Müzik & Video</button>
    </div>

    <!-- Trust Banner -->
    <div class="trust-banner">
      <div class="trust-text">
        <strong>Referanslarımız mevcuttur.</strong> Tüm indirim kuponları ve hesaplar anında teslim edilmektedir.
      </div>
      <a href="https://t.me/DijitalPazarimBot" target="_blank" class="support-pill">Destek</a>
    </div>

    <!-- Products Container -->
    <div class="products-grid" id="productsList">
      <!-- Injected via JavaScript -->
    </div>

    <div class="empty-state" id="emptyState">
      Aradığınız kriterlere uygun ürün bulunamadı.
    </div>

    <!-- Trust Footer -->
    <footer class="trust-footer">
      <div>Güvenli Alışveriş • <span>Shopier Güvencesi</span> • Anında Teslimat</div>
      <div>© 2026 Dijital Pazarım Tüm Hakları Saklıdır.</div>
    </footer>
  </div>

  <script>
    // Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      try {
        window.Telegram.WebApp.setHeaderColor('#080511');
        window.Telegram.WebApp.setBackgroundColor('#080511');
      } catch (e) {}
    }

    let products = [];
    let currentCategory = 'all';
    let searchQuery = '';

    // Fetch products
    async function loadProducts() {
      try {
        const res = await fetch('products_db.json');
        if (res.ok) {
          products = await res.json();
          renderProducts();
        } else {
          console.error("Products could not be loaded");
        }
      } catch (e) {
        console.error("Fetch error:", e);
      }
    }

    function renderProducts() {
      const listEl = document.getElementById('productsList');
      const emptyEl = document.getElementById('emptyState');
      listEl.innerHTML = '';

      const filtered = products.filter(p => {
        const matchesCat = (currentCategory === 'all') || (p.category === currentCategory);
        const matchesSearch = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          p.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
          p.category_label.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-thumb-wrap">
            <img class="product-thumb" src="${p.image}" alt="${p.title}" onerror="this.src='assets/logo.jpg'">
            ${p.badge ? `<div class="product-badge-corner">${p.badge}</div>` : ''}
          </div>
          <div class="product-details">
            <div>
              <div class="product-cat-tag">${p.category_label}</div>
              <h3 class="product-title">${p.title}</h3>
              <p class="product-desc">${p.desc}</p>
            </div>
            <div class="product-footer">
              <div class="product-price">${p.price}</div>
              <a href="${p.url}" target="_blank" class="buy-btn" onclick="openShopier('${p.url}', event)">
                Satın Al
              </a>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function openShopier(url, event) {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
        event.preventDefault();
        window.Telegram.WebApp.openLink(url);
      }
    }

    // Filter Buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.cat;
        renderProducts();
      });
    });

    // Search Input
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderProducts();
    });

    loadProducts();
  </script>
</body>
</html>
