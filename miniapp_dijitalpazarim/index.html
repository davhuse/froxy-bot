<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="tr">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dijital Pazarım - Kod, Kupon & Dijital Lisans</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080511;
      --bg-card: rgba(18, 12, 33, 0.75);
      --bg-card-hover: rgba(28, 18, 52, 0.85);
      --purple-primary: #a855f7;
      --purple-light: #c084fc;
      --purple-dark: #7e22ce;
      --purple-glow: rgba(168, 85, 247, 0.35);
      --pink-accent: #ec4899;
      --border-subtle: rgba(168, 85, 247, 0.22);
      --border-glow: rgba(192, 132, 252, 0.6);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --price-gold: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 0% 50%, rgba(126, 34, 206, 0.12) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-bottom: 70px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 16px 16px 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--purple-light);
      box-shadow: 0 0 16px var(--purple-glow);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff 40%, var(--purple-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--purple-light);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    /* Language Switcher */
    .lang-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 2px;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--purple-primary);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--purple-glow);
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      color: #4ade80;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Search Bar */
    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      backdrop-filter: blur(12px);
    }

    .search-input:focus {
      border-color: var(--purple-light);
      box-shadow: 0 0 18px var(--purple-glow);
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--purple-light);
      stroke-width: 2;
    }

    /* Category Filter Tabs */
    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 2px 6px;
    }

    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, var(--purple-dark), var(--purple-primary));
      border-color: var(--purple-light);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--purple-glow);
    }

    /* Trust Banner */
    .trust-banner {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(236, 72, 153, 0.1));
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .trust-text {
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.4;
    }

    .trust-text strong {
      color: var(--purple-light);
    }

    .support-pill {
      flex-shrink: 0;
      padding: 6px 12px;
      background: var(--purple-primary);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 2px 10px var(--purple-glow);
    }

    /* Product Grid */
    .products-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      backdrop-filter: blur(14px);
    }

    .product-card:active {
      transform: scale(0.985);
      border-color: var(--border-glow);
    }

    .product-thumb-wrap {
      width: 105px;
      min-width: 105px;
      position: relative;
      background: #0f0a1c;
      overflow: hidden;
    }

    .product-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-badge-corner {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid var(--purple-light);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
    }

    .product-details {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .product-cat-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--purple-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .product-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
    }

    .product-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .product-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--price-gold);
      letter-spacing: -0.5px;
    }

    .buy-btn {
      padding: 8px 14px;
      background: linear-gradient(135deg, var(--purple-primary), var(--purple-dark));
      border: 1px solid var(--purple-light);
      border-radius: 12px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 12px var(--purple-glow);
      transition: all 0.2s ease;
    }

    .buy-btn:active {
      transform: scale(0.95);
      background: linear-gradient(135deg, var(--purple-dark), var(--purple-primary));
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 13px;
      display: none;
    }

    /* Trust Footer */
    .trust-footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      padding: 16px 0;
      line-height: 1.6;
    }

    .trust-footer span {
      color: var(--purple-light);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Brand Header -->
    <header class="brand-header">
      <div class="brand-info">
        <img class="brand-avatar" src="assets/logo.jpg" alt="Dijital Pazarım Logo" onerror="this.src='/static/dijitalpazarim_logo.jpg'">
        <div>
          <div class="brand-title" id="tBrandTitle">Dijital Pazarım</div>
          <div class="brand-sub" id="tBrandSub">Kod • Kupon • Üyelik</div>
        </div>
      </div>
      <div class="header-right">
        <!-- Language Switcher -->
        <div class="lang-switch">
          <button class="lang-btn active" id="btnLangTR" onclick="switchLanguage('tr')">TR</button>
          <button class="lang-btn" id="btnLangEN" onclick="switchLanguage('en')">EN</button>
        </div>
        <div class="live-status">
          <div class="status-dot"></div>
          <span id="tStockStatus">Aktif Stok</span>
        </div>
      </div>
    </header>

    <!-- Search Input -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Ürün, kupon veya hesap ara...">
    </div>

    <!-- Category Filter Tabs -->
    <div class="filter-scroll">
      <button class="filter-btn active" data-cat="tumu" id="tabAll">Tüm Ürünler</button>
      <button class="filter-btn" data-cat="market" id="tabMarket">Kupon & Market</button>
      <button class="filter-btn" data-cat="dizi" id="tabStreaming">Dizi & Film</button>
      <button class="filter-btn" data-cat="ai" id="tabAI">Yapay Zeka</button>
      <button class="filter-btn" data-cat="muzik" id="tabMusic">Müzik & Video</button>
    </div>

    <!-- Trust Banner -->
    <div class="trust-banner">
      <div class="trust-text" id="tTrustBanner">
        <strong>Referanslarımız mevcuttur.</strong> Tüm indirim kuponları ve hesaplar anında teslim edilmektedir.
      </div>
      <a href="https://t.me/DijitalPazarimBot" target="_blank" class="support-pill" id="tSupportBtn">Destek</a>
    </div>

    <!-- Products Container -->
    <div class="products-grid" id="productsList">
      <!-- Injected via JavaScript -->
    </div>

    <div class="empty-state" id="emptyState">
      Aradığınız kriterlere uygun ürün bulunamadı.
    </div>

    <!-- Trust Footer -->
    <footer class="trust-footer" id="tFooter">
      <div>Güvenli Alışveriş • <span>Shopier Güvencesi</span> • Anında Teslimat</div>
      <div>© 2026 Dijital Pazarım Tüm Hakları Saklıdır.</div>
    </footer>
  </div>

  <script>
    // Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      try {
        window.Telegram.WebApp.setHeaderColor('#080511');
        window.Telegram.WebApp.setBackgroundColor('#080511');
      } catch (e) {}
    }

    // Language Dictionary
    let currentLang = localStorage.getItem('dp_lang') || 'tr';

    const I18N = {
      tr: {
        brandTitle: "Dijital Pazarım",
        brandSub: "Kod • Kupon • Üyelik",
        stockStatus: "Aktif Stok",
        searchPlaceholder: "Ürün, kupon veya hesap ara...",
        tabAll: "Tüm Ürünler",
        tabMarket: "Kupon & Market",
        tabStreaming: "Dizi & Film",
        tabAI: "Yapay Zeka",
        tabMusic: "Müzik & Video",
        trustBanner: "<strong>Referanslarımız mevcuttur.</strong> Tüm indirim kuponları ve hesaplar anında teslim edilmektedir.",
        supportBtn: "Destek",
        buyBtn: "Satın Al",
        emptyState: "Aradığınız kriterlere uygun ürün bulunamadı.",
        footerLine1: "Güvenli Alışveriş • <span>Shopier Güvencesi</span> • Anında Teslimat",
        footerLine2: "© 2026 Dijital Pazarım Tüm Hakları Saklıdır."
      },
      en: {
        brandTitle: "Digital Market",
        brandSub: "Codes • Coupons • Licenses",
        stockStatus: "In Stock",
        searchPlaceholder: "Search products, codes or accounts...",
        tabAll: "All Products",
        tabMarket: "Coupons & Market",
        tabStreaming: "Movies & Shows",
        tabAI: "Artificial Intelligence",
        tabMusic: "Music & Video",
        trustBanner: "<strong>Verified Merchant.</strong> All discount codes and digital subscriptions are delivered instantly.",
        supportBtn: "Support",
        buyBtn: "Buy Now",
        emptyState: "No products found matching your search.",
        footerLine1: "Secure Payment • <span>Shopier Guarantee</span> • Instant Delivery",
        footerLine2: "© 2026 Dijital Pazarım. All Rights Reserved."
      }
    };

    // English Translations for Product Texts
    const EN_PRODUCT_DATA = {
      "51358950": {
        title: "Disney+ 1 Month Shared Account",
        desc: "Disney+ 1-month shared account access. 4K Ultra HD quality with 30-day warranty. Instant auto-delivery.",
        badge: "Special Deal",
        cat: "MOVIES & SHOWS"
      },
      "51358951": {
        title: "Disney+ 1 Month Private Profile",
        desc: "Disney+ 1-month private personal profile with custom PIN protection. 4K Ultra HD quality, 30 days guaranteed.",
        badge: "Private Profile",
        cat: "MOVIES & SHOWS"
      },
      "51359045": {
        title: "Trendyol Go 800/300 TL Discount Coupon",
        desc: "Trendyol Go Market coupon valid on orders over 800 TL with 300 TL instant discount. Instant delivery.",
        badge: "300 TL Off",
        cat: "COUPON & MARKET"
      },
      "51359046": {
        title: "Trendyol Food 750/250 TL Discount Code",
        desc: "Trendyol Food coupon providing 250 TL instant discount on orders of 750 TL and above. Instant delivery.",
        badge: "250 TL Off",
        cat: "FOOD & COUPON"
      },
      "51359047": {
        title: "Shell 75 TL Fuel Points Voucher",
        desc: "Shell voucher code providing 75 TL fuel or gas discount at Shell stations. Instant delivery.",
        badge: "75 TL Points",
        cat: "FUEL & COMMUTE"
      },
      "51359048": {
        title: "Uber 1,000 TL Discount Pack (500+500 TL)",
        desc: "Uber ride discount bundle containing two 500 TL discount codes (1,000 TL total). Instant delivery.",
        badge: "1,000 TL Pack",
        cat: "TRANSPORTATION"
      },
      "51359049": {
        title: "YouTube Premium 3 Months Individual Code",
        desc: "YouTube and YouTube Music 3-month ad-free personal subscription activation code. Instant delivery.",
        badge: "3 Months Code",
        cat: "MUSIC & VIDEO"
      },
      "51359050": {
        title: "Spotify Premium 4 Months Individual Code",
        desc: "Spotify Premium 4-month individual subscription promo code. Ad-free offline music. Instant delivery.",
        badge: "4 Months Code",
        cat: "MUSIC & AUDIO"
      },
      "51359051": {
        title: "Gemini Pro 18 Months (+5 Gift Invites)",
        desc: "Google Gemini Pro 18-month access plus 5 gift invite licenses. Advanced AI workspace. Instant delivery.",
        badge: "18M + 5 Invites",
        cat: "ARTIFICIAL INTEL"
      },
      "51359052": {
        title: "Gemini Pro 18 Months Personal Invite",
        desc: "Google Gemini Pro 18-month private invite link activated directly on your personal account. 30-day warranty.",
        badge: "18 Months Invite",
        cat: "ARTIFICIAL INTEL"
      },
      "51359053": {
        title: "Gemini Pro 12 Months Personal Invite",
        desc: "Google Gemini Pro 12-month private invite link activated on your personal account. Guaranteed access.",
        badge: "12 Months Invite",
        cat: "ARTIFICIAL INTEL"
      },
      "51359054": {
        title: "Gemini Pro 1 Month Personal Invite",
        desc: "Google Gemini Pro 1-month fast start private invite link for your own account. Instant delivery.",
        badge: "1 Month Invite",
        cat: "ARTIFICIAL INTEL"
      },
      "51359055": {
        title: "Netflix 4K Ultra HD Personal Profile",
        desc: "Netflix 4K Ultra HD personal private profile (30 Days). Uninterrupted viewing with full replacement guarantee.",
        badge: "4K UHD Profile",
        cat: "MOVIES & SHOWS"
      }
    };

    let products = [];
    let currentCategory = 'tumu';
    let searchQuery = '';

    function switchLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('dp_lang', lang);
      document.getElementById('btnLangTR').classList.toggle('active', lang === 'tr');
      document.getElementById('btnLangEN').classList.toggle('active', lang === 'en');
      applyStaticTranslations();
      renderProducts();
    }

    function applyStaticTranslations() {
      const t = I18N[currentLang];
      document.getElementById('tBrandTitle').textContent = t.brandTitle;
      document.getElementById('tBrandSub').textContent = t.brandSub;
      document.getElementById('tStockStatus').textContent = t.stockStatus;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('tabAll').textContent = t.tabAll;
      document.getElementById('tabMarket').textContent = t.tabMarket;
      document.getElementById('tabStreaming').textContent = t.tabStreaming;
      document.getElementById('tabAI').textContent = t.tabAI;
      document.getElementById('tabMusic').textContent = t.tabMusic;
      document.getElementById('tTrustBanner').innerHTML = t.trustBanner;
      document.getElementById('tSupportBtn').textContent = t.supportBtn;
      document.getElementById('emptyState').textContent = t.emptyState;
      document.getElementById('tFooter').innerHTML = `
        <div>${t.footerLine1}</div>
        <div>${t.footerLine2}</div>
      `;
    }

    // Fetch products
    async function loadProducts() {
      try {
        const res = await fetch('products_db.json');
        if (res.ok) {
          products = await res.json();
          renderProducts();
        } else {
          console.error("Ürünler yüklenemedi");
        }
      } catch (e) {
        console.error("Veri hatası:", e);
      }
    }

    function renderProducts() {
      const listEl = document.getElementById('productsList');
      const emptyEl = document.getElementById('emptyState');
      listEl.innerHTML = '';

      const filtered = products.filter(p => {
        const matchesCat = (currentCategory === 'tumu') || (p.category === currentCategory);
        const matchesSearch = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          p.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
          p.category_label.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';

      const t = I18N[currentLang];

      filtered.forEach(p => {
        const enInfo = EN_PRODUCT_DATA[p.id];
        const displayTitle = (currentLang === 'en' && enInfo) ? enInfo.title : p.title;
        const displayDesc = (currentLang === 'en' && enInfo) ? enInfo.desc : p.desc;
        const displayBadge = (currentLang === 'en' && enInfo) ? enInfo.badge : (p.badge || '');
        const displayCat = (currentLang === 'en' && enInfo) ? enInfo.cat : p.category_label;

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-thumb-wrap">
            <img class="product-thumb" src="${p.image}" alt="${displayTitle}" onerror="this.src='assets/logo.jpg'">
            ${displayBadge ? `<div class="product-badge-corner">${displayBadge}</div>` : ''}
          </div>
          <div class="product-details">
            <div>
              <div class="product-cat-tag">${displayCat}</div>
              <h3 class="product-title">${displayTitle}</h3>
              <p class="product-desc">${displayDesc}</p>
            </div>
            <div class="product-footer">
              <div class="product-price">${p.price}</div>
              <a href="${p.url}" target="_blank" class="buy-btn" onclick="openShopier('${p.url}', event)">
                ${t.buyBtn}
              </a>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function openShopier(url, event) {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
        event.preventDefault();
        window.Telegram.WebApp.openLink(url);
      }
    }

    // Filter Buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.cat;
        renderProducts();
      });
    });

    // Search Input
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderProducts();
    });

    // Initialize
    switchLanguage(currentLang);
    loadProducts();
  </script>
</body>
</html>
